backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/YOUR-REPO-NAME   # change this
  branch: main
media_folder: images/uploads
public_folder: /images/uploads
publish_mode: simple
collections:
  - name: site
    label: Website
    files:
      - name: classes
        label: Classes and slots
        file: content/schedule.json
        format: json
        fields:
          - label: Classes
            name: classes
            widget: list
            label_singular: Class
            summary: "{{fields.name}} ({{fields.type}})"
            fields:
              - {label: Show on website, name: active, widget: boolean, default: true, hint: "Switch off to hide this class without deleting it"}
              - {label: Class name, name: name, widget: string}
              - label: Type
                name: type
                widget: select
                options: [{label: Daycare, value: daycare}, {label: Tuition, value: tuition}]
              - {label: Short description, name: description, widget: text}
              - {label: Days, name: days, widget: select, multiple: true, options: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]}
              - {label: Start time, name: start, widget: datetime, date_format: false, time_format: "HH:mm", format: "HH:mm"}
              - {label: End time, name: end, widget: datetime, date_format: false, time_format: "HH:mm", format: "HH:mm"}
              - {label: Ages, name: ages, widget: string, hint: "For example 4 to 6"}
              - {label: Total places, name: capacity, widget: number, value_type: int, min: 0}
              - {label: Places already booked, name: booked, widget: number, value_type: int, min: 0, hint: "Spots left = total places minus booked"}
              - {label: Price, name: price, widget: string, hint: "For example $280 / month"}
      - name: settings
        label: Centre details and homepage text
        file: content/settings.json
        format: json
        fields:
          - {label: Show tuition classes, name: tuitionEnabled, widget: boolean, default: true, hint: "Master switch: turns every tuition class on or off"}
          - {label: Centre name, name: name, widget: string}
          - {label: Subtitle, name: tagline, widget: string}
          - {label: Homepage headline, name: heroTitle, widget: string}
          - {label: Homepage intro, name: heroText, widget: text}
          - {label: Availability note, name: availabilityNote, widget: string}
          - label: Highlights
            name: features
            widget: list
            fields:
              - {label: Title, name: title, widget: string}
              - {label: Text, name: text, widget: text}
          - {label: Hero image, name: heroImage, widget: image, required: false}
          - label: Homepage numbers
            name: stats
            widget: list
            fields: [{label: Number, name: value, widget: string}, {label: Label, name: label, widget: string}]
          - {label: About headline, name: aboutTitle, widget: string}
          - {label: About text, name: aboutText, widget: text}
          - {label: About image, name: aboutImage, widget: image, required: false}
          - label: Programmes
            name: programmes
            widget: list
            fields:
              - {label: Type, name: type, widget: select, options: [{label: Daycare, value: daycare}, {label: Tuition, value: tuition}]}
              - {label: Title, name: title, widget: string}
              - {label: Text, name: text, widget: text}
              - {label: Image, name: image, widget: image}
          - label: Gallery
            name: gallery
            widget: list
            fields: [{label: Photo, name: image, widget: image}, {label: Caption, name: caption, widget: string}]
          - label: Teachers
            name: teachers
            widget: list
            fields: [{label: Name, name: name, widget: string}, {label: Role, name: role, widget: string}, {label: Short bio, name: bio, widget: text}, {label: Photo, name: photo, widget: image}]
          - label: Parent reviews
            name: testimonials
            widget: list
            fields: [{label: Quote, name: quote, widget: text}, {label: Parent name, name: name, widget: string}, {label: Child detail, name: detail, widget: string}]
          - label: FAQ
            name: faqs
            widget: list
            fields: [{label: Question, name: q, widget: string}, {label: Answer, name: a, widget: text}]
          - {label: Phone, name: phone, widget: string}
          - {label: Email, name: email, widget: string}
          - {label: Address, name: address, widget: string}
          - {label: Opening hours, name: hours, widget: string}
